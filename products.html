<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e56318"><link rel="stylesheet" href="styles.css"><script src="app.js"></script><title>Products | Maruti Electricals</title><meta name="description" content="Browse electrical products from Maruti Electricals in Sikanderpur, Gurgaon."></head><body><div id="siteHeader" data-active="Products"></div><main><section class="page-hero products-hero"><div class="container page-hero-inner"><span class="eyebrow light">Product Catalogue</span><h1>Our Products</h1><p>Explore our range of electrical materials and accessories. Pricing and availability are handled by enquiry.</p></div></section><section class="section products-page"><div class="container"><div class="catalog-toolbar"><div class="search-box">⌕ <input id="search" placeholder="Search products or categories"></div><div class="result-count" id="count"></div></div><div class="filter-row" id="filters"></div><div class="product-grid catalogue-grid" id="productGrid"></div></div></section></main><script>
const CATEGORIES=['All Products','Wires & Cables','Switches & Sockets','MCBs & DBs','Pipes & Conduits','Lighting','Fans','Accessories','Other'];let active='All Products';
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const visible=PRODUCTS.filter(p=>(active==='All Products'||p.category===active)&&(!q||(p.name+' '+p.category+' '+p.description).toLowerCase().includes(q)));document.getElementById('count').textContent=visible.length+' products';document.getElementById('productGrid').innerHTML=visible.length?visible.map(p=>productCard(p,false)).join(''):'<div class="empty-state"><h3>No matching products</h3><p>Try another category or search term.</p></div>';document.getElementById('filters').innerHTML=CATEGORIES.map(c=>`<button class="filter-pill ${c===active?'active':''}" data-cat="${c}">${c}</button>`).join('');}
document.addEventListener('DOMContentLoaded',()=>{render();document.getElementById('search').addEventListener('input',render);document.getElementById('filters').addEventListener('click',e=>{if(e.target.dataset.cat){active=e.target.dataset.cat;render();}});});
</script><script>document.getElementById('siteHeader').outerHTML=header('Products');document.write(footer())</script><div id="modalRoot"></div></body></html>
